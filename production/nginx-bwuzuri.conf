server {
  listen 80; server_name YOUR_DOMAIN; return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2; server_name YOUR_DOMAIN;
  # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
  root /opt/bwuzuri/apps/web/dist; index index.html;
  location /api/ { proxy_pass http://127.0.0.1:8080/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /health/ { proxy_pass http://127.0.0.1:8080/health/; }
  location / { try_files $uri $uri/ /index.html; }
}
